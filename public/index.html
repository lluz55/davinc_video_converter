<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Vídeos - ProRes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle">🌙</button>
  <div class="container">
    <h1>🎬 Conversor de Vídeos para ProRes</h1>
    <p class="subtitle">Converte vídeos para formato ProRes (.mov) com codec prores_ks e áudio PCM</p>

    <div class="warning" id="ffmpegWarning">
      ⚠️ FFmpeg não está instalado ou não foi encontrado. Por favor, instale o FFmpeg para usar este conversor.
    </div>

    <form id="convertForm">
      <div class="form-group">
        <label>Selecione os vídeos para converter:</label>
        <div class="file-input-wrapper">
          <input type="file" id="videoInput" name="videos" multiple accept="video/*">
          <label for="videoInput" class="file-input-label" id="dropZone">
            <div>
              <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
              <div style="font-size: 16px; font-weight: 600; margin-bottom: 5px;">
                Clique para selecionar ou arraste os vídeos aqui
              </div>
              <div style="font-size: 12px; color: #666;">
                Suporta: MP4, AVI, MOV, MKV, WEBM
              </div>
            </div>
          </label>
        </div>
        <div class="selected-files" id="selectedFiles"></div>
      </div>

      <div class="form-group">
        <label for="outputDir">Diretório de saída:</label>
        <div style="display: flex;">
          <input type="text" id="outputDir" name="outputDir" placeholder="Ex: ./output ou C:\Videos\Convertidos" value="./output">
          <button type="button" id="browseDir" class="btn" style="width: auto; margin-left: 10px; padding: 10px 15px;">Procurar</button>
        </div>
        <input type="file" id="dirPicker" webkitdirectory directory style="display: none;">
        <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
          Deixe em branco para usar o diretório padrão (./output)
        </small>
      </div>

      <button type="submit" class="btn" id="convertBtn">
        Converter Vídeos
      </button>
    </form>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
      <div id="progressText" style="text-align: center; color: #666; font-size: 14px;"></div>
      <div id="currentFile" style="text-align: center; color: #666; font-size: 12px; margin-top: 5px;"></div>
      <div class="stats" style="display: flex; justify-content: space-around; margin-top: 10px;">
        <div class="stat-item">
          <span id="statCompleted">0</span> / <span id="statTotal">0</span>
        </div>
        <div class="stat-item">
          <span id="statProgress">0%</span>
        </div>
      </div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
